name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }} verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Keep package.json engines and the native sqlite verification matrix in
        # lockstep. npm ci must install a working binding on every supported release line.
        node-version: ['22', '24', '26']

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The full Jest suite replays the digest-bound Phase 0 source commit.
          # A depth-1 checkout makes that immutable baseline unavailable.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ matrix.node-version == '22' }}
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Web browser workflow and axe audit
        if: ${{ matrix.node-version == '22' }}
        run: npm run test:web-browser

      - name: Test with machine-readable release evidence
        if: ${{ matrix.node-version == '22' }}
        # --coverage turns on the coverageThreshold gate from jest.config.js so
        # the documented 70% guideline is actually enforced in CI. #42
        run: npm run release:gate-evidence -- --id full-tests --out .release/full-tests.json -- npm test -- --coverage --runInBand

      - name: Test supported runtime
        if: ${{ matrix.node-version != '22' }}
        run: npm test -- --coverage --runInBand

      - name: Upload full-test receipt
        if: ${{ always() && matrix.node-version == '22' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-test-receipt
          path: .release/full-tests.json
          if-no-files-found: error
          retention-days: 14

  typecheck:
    # Independent type-check dimension. The `verify` job's `tsc` build also
    # catches type errors, but a dedicated, fast job makes the type-safety
    # gate (issue #5) explicit and isolates it from the test matrix.
    name: TypeScript type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  harness-gates:
    name: Lean Harness benchmark and confluence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The same-environment Phase 0 behavior replay is digest-bound to the
          # v0.1.9 source commit and must not silently fall back to estimates.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Architecture confluence receipt
        run: |
          mkdir -p .release/harness
          npm run --silent test:harness-confluence -- --pretty > .release/harness/confluence.json

      - name: Same-environment Phase 0 baseline receipt
        run: npm run bench:harness:baseline -- --out .release/harness/baseline.json

      - name: Candidate receipt
        run: npm run bench:harness -- --mode candidate --cold-runs 30 --warm-runs 30 --out .release/harness/candidate.json

      - name: Compare candidate against same-environment baseline
        run: npm run --silent bench:harness:compare -- --baseline .release/harness/baseline.json --candidate .release/harness/candidate.json > .release/harness/comparison.json

      - name: Same-environment task/token evaluation
        run: npm run --silent bench:harness:eval -- --iterations 30 --out .release/harness/eval.json > /dev/null

      - name: Upload Harness receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-receipts
          path: .release/harness
          if-no-files-found: error
          retention-days: 14

  security-audit:
    # Dependency vulnerability dimension (issues #71 / #62). Blocks on
    # high-severity advisories; the non-test `dep-health` job below reports
    # lower-severity / deprecated-package drift without failing the build.
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --audit-level=high

  release-gate:
    # Read-only release gate (issue #86). Verifies version/CHANGELOG
    # consistency, git hygiene, and that the package packs correctly. Tests
    # are skipped here because the `verify` job already runs the full suite.
    name: Release gate (release:check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # release:check inspects git tags (e.g. v0.1.4) for the CHANGELOG gate.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run deps:check -- --policy-only

      - name: Build (exact npm package artifact needs dist/)
        run: npm run build

      - name: release:check
        run: npm run release:check -- --skip-tests

  package-artifact:
    name: Build the exact release tgz once
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack and attest one artifact
        run: npm run release:artifact -- --out-dir .release/package --receipt .release/package/artifact.json

      - name: Upload exact tgz and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: .release/package
          if-no-files-found: error
          retention-days: 14

  runtime-matrix:
    name: Exact tgz on Node ${{ matrix.node-version }} floor
    needs: package-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-major: '22'
            node-version: '22.12.0'
          - node-major: '24'
            node-version: '24.0.0'
          - node-major: '26'
            node-version: '26.0.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install receipt runner dependencies
        run: npm ci

      - name: Download the exact release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: .release/package

      - name: Clean-install and probe the downloaded tgz
        run: |
          TARBALL=".release/package/$(node -p "require('./.release/package/artifact.json').tarball.filename")"
          npm run test:runtime-matrix -- --tarball "$TARBALL" --artifact-receipt .release/package/artifact.json --out ".release/runtime-node${{ matrix.node-major }}.json"

      - name: Upload runtime receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-node${{ matrix.node-major }}
          path: .release/runtime-node${{ matrix.node-major }}.json
          if-no-files-found: error
          retention-days: 14

  web-e2e-primary:
    name: Web E2E full suite three consecutive runs
    needs: package-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install E2E runner dependencies
        run: npm ci

      - name: Locate real Chrome and install Playwright ffmpeg
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npx playwright install ffmpeg

      - name: Download the exact release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: .release/package

      - name: Run full packaged browser suite three times
        run: |
          TARBALL=".release/package/$(node -p "require('./.release/package/artifact.json').tarball.filename")"
          npm run test:web-e2e:primary -- \
            --tarball "$TARBALL" \
            --receipt .release/package/artifact.json \
            --chrome "$CHROME_PATH"

      - name: Upload primary Web E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-primary
          path: tests/tmp/web-e2e/primary-*
          if-no-files-found: error
          retention-days: 14

  web-e2e-runtime:
    name: Web E2E critical journey on Node ${{ matrix.node-version }} floor
    needs: package-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-major: '22'
            node-version: '22.12.0'
          - node-major: '24'
            node-version: '24.0.0'
          - node-major: '26'
            node-version: '26.0.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install E2E runner dependencies
        run: npm ci

      - name: Locate real Chrome and install Playwright ffmpeg
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npx playwright install ffmpeg

      - name: Download the exact release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: .release/package

      - name: Run critical packaged browser journey
        run: |
          TARBALL=".release/package/$(node -p "require('./.release/package/artifact.json').tarball.filename")"
          export ORION_WEB_E2E_RUNNER_NAME="github-actions"
          export ORION_WEB_E2E_RUNNER_IMAGE="${ImageOS:-ubuntu-24.04}@${ImageVersion:-unknown}-${RUNNER_ARCH:-unknown}"
          export ORION_WEB_E2E_CHROME_CHANNEL="system-google-chrome"
          ORION_WEB_E2E_RUN_ROOT="tests/tmp/web-e2e/ci-runtime-node${{ matrix.node-major }}" \
          ORION_WEB_E2E_PROFILE=critical \
          ORION_WEB_E2E_TARBALL="$TARBALL" \
          ORION_WEB_E2E_RECEIPT=.release/package/artifact.json \
          npm run test:web-e2e:critical

      - name: Upload runtime Web E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-runtime-node${{ matrix.node-major }}
          path: tests/tmp/web-e2e/ci-runtime-node${{ matrix.node-major }}
          if-no-files-found: error
          retention-days: 14

  web-e2e-receipt:
    name: Aggregate exact-artifact Web E2E receipt
    needs:
      - package-artifact
      - web-e2e-primary
      - web-e2e-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install receipt verifier dependencies
        run: npm ci

      - name: Download exact package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: .release/package

      - name: Download primary Web E2E evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-e2e-primary
          path: .release/web-e2e/primary

      - name: Download runtime Web E2E evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: web-e2e-runtime-node*
          path: .release/web-e2e/runtime

      - name: Verify and aggregate Web E2E evidence
        shell: bash
        run: |
          mapfile -t PRIMARY < <(find .release/web-e2e/primary -path '*/run-*/manifest.json' -type f ! -path '*/scenarios/*' | sort)
          mapfile -t RUNTIME < <(find .release/web-e2e/runtime -name manifest.json -type f ! -path '*/scenarios/*' | sort)
          test "${#PRIMARY[@]}" -eq 3
          test "${#RUNTIME[@]}" -eq 3
          ARGS=(--artifact .release/package/artifact.json --live-canary NOT_RUN)
          for MANIFEST in "${PRIMARY[@]}"; do ARGS+=(--primary "$MANIFEST"); done
          for MANIFEST in "${RUNTIME[@]}"; do ARGS+=(--runtime "$MANIFEST"); done
          npm run --silent release:web-e2e-receipt -- \
            "${ARGS[@]}" \
            --out .release/web-e2e-receipt.json

      - name: Upload Web E2E receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-e2e-receipt
          path: .release/web-e2e-receipt.json
          if-no-files-found: error
          retention-days: 30

  release-receipt:
    name: Aggregate fail-closed v0.3.x release receipt
    needs:
      - verify
      - typecheck
      - harness-gates
      - security-audit
      - release-gate
      - package-artifact
      - runtime-matrix
      - web-e2e-receipt
      - dep-health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install receipt verifier dependencies
        run: npm ci

      - name: Download exact package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: .release/package

      - name: Download Harness receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harness-receipts
          path: .release/harness

      - name: Download full-test receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: full-test-receipt
          path: .release/tests

      - name: Download runtime receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-node*
          path: .release/runtime
          merge-multiple: true

      - name: Download Web E2E receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-e2e-receipt
          path: .release/web-e2e

      - name: Verify and aggregate all receipts
        run: |
          npm run --silent release:receipt -- \
            --artifact .release/package/artifact.json \
            --runtime .release/runtime/runtime-node22.json \
            --runtime .release/runtime/runtime-node24.json \
            --runtime .release/runtime/runtime-node26.json \
            --benchmark-baseline .release/harness/baseline.json \
            --benchmark-candidate .release/harness/candidate.json \
            --benchmark-comparison .release/harness/comparison.json \
            --evaluation .release/harness/eval.json \
            --confluence .release/harness/confluence.json \
            --full-tests .release/tests/full-tests.json \
            --web-e2e .release/web-e2e/web-e2e-receipt.json \
            --out .release/release-receipt.json

      - name: Upload final release receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-receipt
          path: .release/release-receipt.json
          if-no-files-found: error
          retention-days: 30

  dep-health:
    # Blocking offline verification for native ABI and dependency-tree health.
    # Registry-backed audit is the blocking security-audit job above; optional
    # outdated reporting requires an explicit local --full-network run (#155).
    name: Dependency health report (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: dep-health-check
        run: bash scripts/release/dep-health-check.sh
